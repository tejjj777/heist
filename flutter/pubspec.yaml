name: heist_flutter
description: HEIST student money planner with local SQLite and Hive recovery.
publish_to: none
version: 1.0.2+3
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  hive_ce: ^2.24.0
  material_ui: ^1.11.1
  sqflite: ^2.4.2
  sqflite_common: ^2.5.4
  sqflite_common_ffi: ^2.3.6
  sqflite_common_ffi_web: ^1.2.0
  path: ^1.9.1
  file_selector: ^1.0.3
  image_picker: ^1.2.4
  intl: ^0.20.2
  uuid: ^4.5.1
  web: ^1.1.1
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  cryptography: ^2.9.0
  archive: ^4.0.7
  http: ^1.4.0
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^7.0.0
  go_router: ^17.0.0
  fl_chart: ^1.1.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
  csv: ^6.0.0
  google_mlkit_text_recognition: ^1.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/heist-logo.png
    - assets/fonts/OFL-NotoSansTelugu.txt
    - assets/fonts/OFL-NotoSansDevanagari.txt
  fonts:
    - family: NotoTelugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu.ttf
    - family: NotoHindi
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: HeistDisplay
      fonts:
        - asset: assets/fonts/Rubik-ExtraBoldItalic.ttf
          weight: 800
          style: italic
